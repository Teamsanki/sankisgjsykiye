<script>
document.addEventListener("DOMContentLoaded", () => {

  /* =====================================
     INTRO VIDEO ENGINE
  ===================================== */

  const introScreen = document.getElementById("introScreen");
  const introVideo = document.getElementById("introVideo");
  const enterSite = document.getElementById("enterSite");

  // IMPORTANT: YAHAN APNI ACTUAL INTRO VIDEO KA NAAM LIKHNA
  const introVideoPath = "assets/videos/intro.mp4";

  let introFinished = false;

  function finishIntro() {
    if (introFinished) return;

    introFinished = true;

    introScreen.classList.add("finished");
    document.body.classList.remove("intro-playing");

    setTimeout(() => {
      introScreen.remove();
    }, 1600);
  }

  if (introVideo && introScreen) {

    introVideo.muted = true;
    introVideo.autoplay = true;
    introVideo.playsInline = true;

    introVideo.src = introVideoPath;

    introVideo.addEventListener("ended", finishIntro, { once: true });

    introVideo.addEventListener("error", () => {
      console.error("Intro video not found:", introVideoPath);
      finishIntro();
    }, { once: true });

    // Safety fallback if video never loads
    const introTimeout = setTimeout(() => {
      console.warn("Intro video loading timeout");
      finishIntro();
    }, 20000);

    introVideo.addEventListener("ended", () => {
      clearTimeout(introTimeout);
    }, { once: true });

    introVideo.load();

    introVideo.play().catch(error => {
      console.warn("Autoplay blocked:", error);

      enterSite.style.display = "block";

      enterSite.addEventListener("click", () => {
        introVideo.play().then(() => {
          enterSite.style.display = "none";
        }).catch(() => {
          finishIntro();
        });
      }, { once: true });
    });
  }


  /* =====================================
     BACKGROUND VIDEO ENGINE
  ===================================== */

  const backgroundVideos = [
    "assets/videos/IMG_7999_20261017132345.mp4"

    // Add more videos here:
    // "assets/videos/video2.mp4",
    // "assets/videos/video3.mp4"
  ];

  const bgVideo1 = document.getElementById("bgVideo1");
  const bgVideo2 = document.getElementById("bgVideo2");

  let currentIndex = 0;
  let activeVideo = bgVideo1;
  let nextVideo = bgVideo2;
  let switching = false;

  function startBackground() {

    if (!backgroundVideos.length || !activeVideo) return;

    const firstVideo = backgroundVideos[0];

    activeVideo.src = firstVideo;
    activeVideo.muted = true;
    activeVideo.playsInline = true;

    // One video: simply loop it
    if (backgroundVideos.length === 1) {
      activeVideo.loop = true;
    }

    activeVideo.addEventListener("canplay", () => {
      activeVideo.classList.add("active");
      activeVideo.play().catch(error => {
        console.warn("Background autoplay blocked:", error);
      });
    }, { once: true });

    activeVideo.load();
  }

  function switchBackground() {

    if (
      switching ||
      backgroundVideos.length < 2
    ) return;

    switching = true;

    currentIndex = (currentIndex + 1) % backgroundVideos.length;

    const incomingVideo = nextVideo;
    const outgoingVideo = activeVideo;

    incomingVideo.src = backgroundVideos[currentIndex];
    incomingVideo.muted = true;
    incomingVideo.playsInline = true;
    incomingVideo.loop = false;

    incomingVideo.load();

    incomingVideo.addEventListener("canplay", function handleReady() {

      incomingVideo.removeEventListener("canplay", handleReady);

      incomingVideo.currentTime = 0;

      incomingVideo.play().catch(error => {
        console.warn("Next background video failed:", error);
      });

      incomingVideo.classList.add("active");
      outgoingVideo.classList.remove("active");

      setTimeout(() => {

        outgoingVideo.pause();
        outgoingVideo.removeAttribute("src");
        outgoingVideo.load();

        activeVideo = incomingVideo;
        nextVideo = outgoingVideo;

        switching = false;

      }, 1900);

    }, { once: true });
  }

  bgVideo1.addEventListener("ended", switchBackground);
  bgVideo2.addEventListener("ended", switchBackground);

  startBackground();


  /* =====================================
     SCROLL REVEAL
  ===================================== */

  const revealElements = document.querySelectorAll(".reveal");

  if ("IntersectionObserver" in window) {

    const observer = new IntersectionObserver((entries) => {

      entries.forEach(entry => {

        if (entry.isIntersecting) {

          entry.target.classList.add("visible");

          observer.unobserve(entry.target);
        }

      });

    }, {
      threshold: 0.15
    });

    revealElements.forEach(element => {
      observer.observe(element);
    });

  } else {

    revealElements.forEach(element => {
      element.classList.add("visible");
    });

  }


  /* =====================================
     SCROLL PROGRESS BAR
  ===================================== */

  const progressBar = document.getElementById("scrollProgress");

  function updateProgress() {

    const scrollTop = window.scrollY;

    const scrollHeight =
      document.documentElement.scrollHeight - window.innerHeight;

    const progress = scrollHeight > 0
      ? (scrollTop / scrollHeight) * 100
      : 0;

    progressBar.style.width = progress + "%";
  }

  window.addEventListener("scroll", updateProgress, {
    passive: true
  });

  updateProgress();

});
</script>

<script src="config.js" defer></script>
