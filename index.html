<script>
document.addEventListener("DOMContentLoaded", function () {

  /* =====================================
     INTRO VIDEO ENGINE
     MAXIMUM 10 SECONDS
  ===================================== */

  const introScreen = document.getElementById("introScreen");
  const introVideo = document.getElementById("introVideo");

  const introVideoPath = "assets/videos/intro.mp4";

  let introFinished = false;
  let introTimer = null;

  function finishIntro() {

    if (introFinished) return;

    introFinished = true;

    clearTimeout(introTimer);

    // Fade out intro
    if (introScreen) {
      introScreen.classList.add("finished");
    }

    // Fade in website
    document.body.classList.remove("intro-playing");
    document.body.classList.add("site-visible");

    // Remove intro after transition
    setTimeout(() => {
      if (introScreen) {
        introScreen.remove();
      }
    }, 1600);
  }

  if (introScreen && introVideo) {

    introVideo.muted = true;
    introVideo.defaultMuted = true;
    introVideo.autoplay = true;
    introVideo.playsInline = true;

    introVideo.setAttribute("muted", "");
    introVideo.setAttribute("playsinline", "");
    introVideo.setAttribute("webkit-playsinline", "");

    // Maximum 10-second timer
    introTimer = setTimeout(() => {
      finishIntro();
    }, 10000);

    // Video ends naturally
    introVideo.addEventListener("ended", finishIntro, {
      once: true
    });

    // Video loading or playback error
    introVideo.addEventListener("error", function () {
      console.error("INTRO VIDEO ERROR:", introVideo.error);
      finishIntro();
    }, { once: true });

    // Load intro
    introVideo.src = introVideoPath;
    introVideo.load();

    // Play intro
    const playPromise = introVideo.play();

    if (playPromise !== undefined) {

      playPromise.catch(function (error) {

        console.error("INTRO AUTOPLAY ERROR:", error);

        // Never leave the user on a blank screen
        finishIntro();

      });

    }

  } else {

    // If intro HTML is missing, show website
    finishIntro();

  }


  /* =====================================
     BACKGROUND VIDEO ENGINE
  ===================================== */

  const backgroundVideos = [
    "assets/videos/IMG_7999_20261017132345.mp4"

    // Add more videos:
    // "assets/videos/video2.mp4",
    // "assets/videos/video3.mp4"
  ];

  const bgVideo1 = document.getElementById("bgVideo1");
  const bgVideo2 = document.getElementById("bgVideo2");

  let currentIndex = 0;
  let activeVideo = bgVideo1;
  let nextVideo = bgVideo2;
  let switching = false;

  function startBackground() {

    if (!activeVideo || backgroundVideos.length === 0) return;

    activeVideo.src = backgroundVideos[0];
    activeVideo.muted = true;
    activeVideo.playsInline = true;

    // Single video: continuous loop
    if (backgroundVideos.length === 1) {

      activeVideo.loop = true;

    }

    activeVideo.addEventListener("canplay", function () {

      activeVideo.classList.add("active");

      activeVideo.play().catch(error => {
        console.warn("Background video autoplay blocked:", error);
      });

    }, { once: true });

    activeVideo.addEventListener("error", function () {
      console.error("Background video could not load.");
    }, { once: true });

    activeVideo.load();
  }


  /* =====================================
     BACKGROUND VIDEO CROSSFADE
     FOR MULTIPLE VIDEOS
  ===================================== */

  function switchBackground() {

    if (
      switching ||
      backgroundVideos.length < 2 ||
      !nextVideo ||
      !activeVideo
    ) return;

    switching = true;

    currentIndex = (currentIndex + 1) % backgroundVideos.length;

    const incoming = nextVideo;
    const outgoing = activeVideo;

    incoming.src = backgroundVideos[currentIndex];
    incoming.muted = true;
    incoming.playsInline = true;
    incoming.loop = false;

    incoming.load();

    incoming.addEventListener("canplay", function ready() {

      incoming.removeEventListener("canplay", ready);

      incoming.currentTime = 0;

      incoming.play().catch(error => {
        console.warn("Next background video failed:", error);
      });

      incoming.classList.add("active");
      outgoing.classList.remove("active");

      setTimeout(() => {

        outgoing.pause();
        outgoing.removeAttribute("src");
        outgoing.load();

        activeVideo = incoming;
        nextVideo = outgoing;

        switching = false;

      }, 1900);

    }, { once: true });
  }

  if (bgVideo1 && bgVideo2) {

    bgVideo1.addEventListener("ended", switchBackground);
    bgVideo2.addEventListener("ended", switchBackground);

  }

  startBackground();


  /* =====================================
     SCROLL REVEAL
  ===================================== */

  const revealElements = document.querySelectorAll(".reveal");

  if ("IntersectionObserver" in window) {

    const observer = new IntersectionObserver((entries) => {

      entries.forEach(entry => {

        if (entry.isIntersecting) {

          entry.target.classList.add("visible");

          observer.unobserve(entry.target);

        }

      });

    }, {
      threshold: 0.15
    });

    revealElements.forEach(element => {
      observer.observe(element);
    });

  } else {

    revealElements.forEach(element => {
      element.classList.add("visible");
    });

  }


  /* =====================================
     SCROLL PROGRESS BAR
  ===================================== */

  const progressBar = document.getElementById("scrollProgress");

  function updateProgress() {

    if (!progressBar) return;

    const scrollTop = window.scrollY;

    const scrollHeight =
      document.documentElement.scrollHeight - window.innerHeight;

    const progress = scrollHeight > 0
      ? (scrollTop / scrollHeight) * 100
      : 0;

    progressBar.style.width = progress + "%";

  }

  window.addEventListener("scroll", updateProgress, {
    passive: true
  });

  updateProgress();

});
</script>

<script src="config.js" defer></script>
<script src="js/site.js" defer></script>
